<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picasa Foto Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <span>{{ root_label }}</span>
        <button id="refresh-btn" title="Aggiorna">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        </button>
      </div>
      <div id="version-tag">v{{ app_version }}</div>
      <label id="show-hidden-toggle">
        <input type="checkbox" id="show-hidden-checkbox">
        Mostra cartelle nascoste
      </label>
      <div id="immich-status" class="hidden"></div>
      <div id="precache-status" class="hidden"></div>
      <div id="tree"></div>
    </aside>
    <main id="main">
      <div id="breadcrumb">(cartella principale)</div>
      <div id="grid"></div>
      <div id="empty-msg" class="hidden">Nessuna foto in questa cartella.</div>
    </main>
  </div>

  <div id="lightbox" class="hidden">
    <button id="lb-close" class="lb-btn" title="Chiudi">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
    </button>
    <button id="lb-prev" class="lb-btn" title="Precedente">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6" /></svg>
    </button>
    <img id="lb-img" src="" alt="">
    <button id="lb-next" class="lb-btn" title="Successiva">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6" /></svg>
    </button>
    <div id="lb-caption"></div>
  </div>

  <div id="move-modal" class="hidden">
    <div class="modal-box">
      <h3>Sposta "<span id="move-modal-title"></span>" in:</h3>
      <div id="move-tree-root">{{ root_label }} (cartella principale)</div>
      <div id="move-tree"></div>
      <div id="move-error" class="modal-error hidden"></div>
      <div class="modal-actions">
        <button id="move-cancel">Annulla</button>
        <button id="move-confirm">Sposta qui</button>
      </div>
    </div>
  </div>

  <div id="delete-modal" class="hidden">
    <div class="modal-box">
      <h3>Eliminare "<span id="delete-modal-title"></span>"?</h3>
      <p class="modal-warning">
        Questa azione elimina per sempre la cartella e tutto il suo contenuto
        dal NAS. Non si può annullare.
      </p>
      <input type="text" id="delete-confirm-input" placeholder="Scrivi il nome della cartella per confermare" autocomplete="off">
      <div id="delete-error" class="modal-error hidden"></div>
      <div class="modal-actions">
        <button id="delete-cancel">Annulla</button>
        <button id="delete-confirm" disabled>Elimina definitivamente</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
